<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MI XR Platform</title>
    <!-- 引入 Tailwind CSS 运行时 -->

    <!-- 引入 React 全局变量 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 引入 Babel 进行浏览器端的 JSX 实时编译 -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // ==========================================
        // 核心：Lucide-React 到 浏览器版本的适配器
        // ==========================================
        const LucideIcon = ({ name, size = 24, className = '', strokeWidth = 2, color = 'currentColor', ...props }) => {
            // 从全局 lucide 对象提取 SVG 结构数据
            const iconData = window.lucide?.icons[name];
            
            // 防御性渲染：如果某些旧版本图标被重命名导致找不到，渲染一个灰色占位块
            if (!iconData) {
                return <span style={{ width: size, height: size, display: 'inline-block', backgroundColor: '#f3f4f6' }} className={`rounded ${className}`} {...props} />;
            }

            return React.createElement('svg', {
                xmlns: "http://www.w3.org/2000/svg",
                width: size,
                height: size,
                viewBox: "0 0 24 24",
                fill: "none",
                stroke: color,
                strokeWidth: strokeWidth,
                strokeLinecap: "round",
                strokeLinejoin: "round",
                className: className,
                ...props
            }, iconData.map(([elemTag, elemAttrs], index) => React.createElement(elemTag, { ...elemAttrs, key: index })));
        };

        const createIcon = (name) => (props) => <LucideIcon name={name} {...props} />;

        // 映射你代码中使用到的所有图标 (必须符合 Lucide 的 PascalCase 键名)
        const Menu = createIcon('Menu');
        const Search = createIcon('Search');
        const Plus = createIcon('Plus');
        const Settings = createIcon('Settings');
        const Check = createIcon('Check');
        const User = createIcon('User');
        const ChevronRight = createIcon('ChevronRight');
        const ChevronLeft = createIcon('ChevronLeft');
        const Eye = createIcon('Eye');
        const Trash2 = createIcon('Trash2');
        const Edit3 = createIcon('Edit3');
        const Lock = createIcon('Lock');
        const Box = createIcon('Box');
        const ImageIcon = createIcon('Image'); // 解决原代码中的 import { Image as ImageIcon }
        const RotateCw = createIcon('RotateCw');
        const Monitor = createIcon('Monitor');
        const PenTool = createIcon('PenTool');
        const MonitorPlay = createIcon('MonitorPlay');
        const Component = createIcon('Component');
        const List = createIcon('List');
        const DownloadCloud = createIcon('DownloadCloud');
        const Play = createIcon('Play');
        const CheckCircle2 = createIcon('CheckCircle2');
        const FolderOpen = createIcon('FolderOpen');
        const UploadCloud = createIcon('UploadCloud');
        const X = createIcon('X');
        const Key = createIcon('Key');
        const LogOut = createIcon('LogOut');
        const ShieldAlert = createIcon('ShieldAlert');
        const ChevronDown = createIcon('ChevronDown');


        // ==========================================
        // 原有业务数据与状态设定
        // ==========================================
        const INITIAL_GROUPS = [
          { id: 'g1', name: '项目A' },
          { id: 'g2', name: '项目B' },
          { id: 'g3', name: '项目C' },
        ];

        const INITIAL_PROJECTS = [
          { id: 1, name: 'SU7 外观评审', updated: '2026-01-14 15:59', status: '已停止', imageColor: 'bg-orange-200', groupId: 'g1', coverImage: null },
          { id: 2, name: '项目B_内饰', updated: '最近编辑：大约 2 个月前', status: '', imageColor: 'bg-gray-200', groupId: 'g2', coverImage: null },

          { id: 'WT', name: 'WT', username: 'WT', password: '123', role: '数字主管', roleColor: 'text-red-600 bg-red-100 border-red-200', groups: ['g1', 'g2', 'g3'] },
          { id: '004', name: 'weida', username: 'weida', password: '123', role: '可视化专员', roleColor: 'text-blue-600 bg-blue-100 border-blue-200', groups: ['g1', 'g2', 'g3'] },

                </button>
                <div className="flex gap-3">
                  <div className="relative">
                    <Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" />
                    <input 
                      type="text" 
                      placeholder="搜索项目名称" 
                      className="pl-9 pr-4 py-1.5 border border-gray-200 rounded text-sm w-64 focus:outline-none focus:border-orange-500"
                    />
                  </div>
                  <button onClick={openNewProject} className="bg-orange-500 hover:bg-orange-600 text-white px-4 py-1.5 rounded text-sm flex items-center gap-1 transition-colors">

                  </button>
                </div>
              </div>

              <div className="flex gap-6 border-b border-gray-200 mb-6">
                <button

                  className={`pb-3 text-sm font-medium transition-colors border-b-2 ${activeTab === 'all' ? 'border-orange-500 text-orange-500' : 'border-transparent text-gray-500 hover:text-gray-800'}`}
                >
                  全部
                </button>
                {projectGroups.map(group => (
                  <button 
                    key={group.id}

                    className={`pb-3 text-sm font-medium transition-colors border-b-2 ${activeTab === group.id ? 'border-orange-500 text-orange-500' : 'border-transparent text-gray-500 hover:text-gray-800'}`}

                  <div

                      ) : project.id === 1 ? (
                          <div className="absolute inset-0 bg-orange-100/50 flex flex-col items-center justify-center text-orange-800">
                              <Box size={48} className="opacity-50" />

                          <div className="absolute inset-0 bg-gray-800 flex items-center justify-center text-gray-600">

                         {project.groupId && (

        const ViewRenderFarm = () => (

                    <h2 className="text-lg font-bold text-gray-800">解析列表</h2>
                    <div className="relative">
                        <input type="text" placeholder="请输入" className="pl-3 pr-8 py-1.5 border border-gray-200 rounded text-sm w-64 focus:outline-none focus:border-orange-500 transition-colors" />

                <div className="flex-1 overflow-auto">
                    <table className="w-full text-left border-collapse">

        const ViewProjectDetail = ({ project, onBack, onUpdateProject, currentUser, projectGroups }) => {
          const [isEditingName, setIsEditingName] = useState(false);
          const [editName, setEditName] = useState(project?.name || '');
          const [models, setModels] = useState([{ id: 1, name: 'Audi_RS_E-tron_GT_2022_VR.vpb', type: '主模型' }]);

          const coverInputRef = useRef(null);

            }

          return (
            <div className="flex-1 flex flex-col bg-gray-50 overflow-hidden">
               <div className="h-12 bg-white flex items-center px-6 shrink-0 border-b border-gray-100">
                  <button onClick={onBack} className="flex items-center text-gray-600 hover:text-gray-900 text-sm">

                      <div 
                        className={`relative w-64 h-36 rounded-md overflow-hidden ${project?.coverImage ? 'bg-black' : project?.imageColor || 'bg-orange-100'} flex items-center justify-center shrink-0 group cursor-pointer`}
                        onClick={() => coverInputRef.current?.click()}
                      >
                          {project?.coverImage ? (
                            <img src={project.coverImage} alt="cover" className="w-full h-full object-cover" />
                          ) : (
                            <Box size={48} className="text-orange-500 opacity-50" />
                          )}
                          <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white text-sm font-medium">

                                    const isSelected = editingUser.groups.includes(group.id);
                                    return (
                                        <label key={group.id} className={`flex items-center gap-2 text-sm px-2 py-2 rounded cursor-pointer transition-colors ${isSelected ? 'bg-orange-50 text-orange-700 font-medium' : 'text-gray-700 hover:bg-gray-100'}`}>
                                            <input type="checkbox" checked={isSelected} onChange={(e) => {
                                                    const newGroups = e.target.checked 
                                                        ? [...editingUser.groups, group.id]
                                                        : editingUser.groups.filter(id => id !== group.id);
                                                    setEditingUser({...editingUser, groups: newGroups});
                                                }} className="rounded text-orange-500 focus:ring-orange-500 w-4 h-4" />
                                            {group.name}
                                        </label>
                                    );
                                })}
                            </div>
                        </div>
                      </div>
                    </div>

                    <div className="p-4 border-t border-gray-100 flex justify-end gap-3 bg-gray-50/50">
                      <button onClick={() => setEditingUser(null)} className="px-4 py-2 text-sm text-gray-600 bg-white border border-gray-200 rounded hover:bg-gray-50 transition-colors">取消</button>
                      <button onClick={handleSaveUserEdit} className="px-4 py-2 text-sm text-white bg-orange-500 rounded hover:bg-orange-600 shadow-sm transition-colors">保存修改</button>
                    </div>
                  </div>
                </div>
               )}

               {resetPasswordUser && (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center transition-opacity">
                  <div className="bg-white rounded-lg w-[400px] shadow-xl overflow-hidden flex flex-col animate-in fade-in zoom-in-95 duration-200">
                    <div className="flex justify-between items-center p-4 border-b border-gray-100">
                      <h3 className="font-bold text-gray-800">修改登录密码</h3>
                      <button onClick={() => setResetPasswordUser(null)} className="text-gray-400 hover:text-gray-600"><X size={20} /></button>
                    </div>
                    <div className="p-6 flex flex-col gap-4">
                      <div className="text-sm text-gray-600 bg-gray-50 p-3 rounded-md border border-gray-100 flex items-center gap-3 mb-2">
                         <div className="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold bg-orange-400">
                             {resetPasswordUser.name.charAt(0).toUpperCase()}
                         </div>
                         <div>
                            <div className="font-medium text-gray-800">正在为 <span className="text-orange-500">{resetPasswordUser.name}</span> 修改密码</div>
                            <div className="text-xs text-gray-400">账号: {resetPasswordUser.username}</div>
                         </div>
                      </div>
                      <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1"><span className="text-red-500">*</span> 新密码</label>
                          <div className="relative">
                              <Lock size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" />
                              <input type="password" value={newPasswordInput} onChange={e => setNewPasswordInput(e.target.value)} placeholder="请输入新密码" autoFocus className="w-full pl-9 pr-3 py-2 border border-gray-200 rounded-md text-sm focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500" />
                          </div>
                      </div>
                    </div>
                    <div className="p-4 border-t border-gray-100 flex justify-end gap-3 bg-gray-50/50">
                      <button onClick={() => setResetPasswordUser(null)} className="px-4 py-2 text-sm text-gray-600 bg-white border border-gray-200 rounded hover:bg-gray-50 transition-colors">取消</button>
                      <button onClick={handleSaveNewPassword} disabled={!newPasswordInput.trim()} className={`px-4 py-2 text-sm text-white rounded shadow-sm transition-colors ${newPasswordInput.trim() ? 'bg-orange-500 hover:bg-orange-600' : 'bg-orange-300 cursor-not-allowed'}`}>保存新密码</button>
                    </div>
                  </div>
                </div>
               )}
            </div>
          );
        };

        const ModalNewProject = ({ isOpen, onClose, onCreate, allowedGroups }) => {
          const [name, setName] = useState('');
          const [groupId, setGroupId] = useState('');
          const [coverImage, setCoverImage] = useState(null);
          
          const [isDropdownOpen, setIsDropdownOpen] = useState(false);
          const [groupSearchQuery, setGroupSearchQuery] = useState('');
          
          const fileInputRef = useRef(null);

          useEffect(() => {
            if (isOpen) {
              setName('');
              setGroupId('');
              setCoverImage(null);
              setIsDropdownOpen(false);
              setGroupSearchQuery('');
            }
          }, [isOpen]);

          if (!isOpen) return null;

          const handleImageUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
              setCoverImage(URL.createObjectURL(file));
            }
          };

          const handleSubmit = () => {
            if (!name.trim() || !groupId) return;
            onCreate({ name: name.trim(), groupId: groupId, coverImage });
            onClose();
          };

          const selectedGroup = allowedGroups.find(g => g.id === groupId);

          return (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center transition-opacity">
              <div className="bg-white rounded-lg w-[500px] shadow-xl overflow-hidden flex flex-col animate-in fade-in zoom-in-95 duration-200">
                <div className="flex justify-between items-center p-4 border-b border-gray-100">
                  <h3 className="font-bold text-gray-800">新建项目</h3>
                  <button onClick={onClose} className="text-gray-400 hover:text-gray-600"><X size={20} /></button>
                </div>
                
                <div className="p-6 flex flex-col gap-5">
                  <div>
                    <label className="block text-sm text-gray-700 mb-1.5"><span className="text-red-500">*</span> 项目名称</label>
                    <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="请输入项目名称" className="w-full px-3 py-2 border border-gray-200 rounded text-sm focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500"/>
                  </div>

                  <div>
                     <label className="block text-sm text-gray-700 mb-1.5"><span className="text-red-500">*</span> 所属项目组</label>
                     <div className="relative">
                         <div 
                           className={`w-full px-3 py-2 border ${isDropdownOpen ? 'border-orange-500 ring-1 ring-orange-500' : 'border-gray-200'} rounded text-sm bg-white flex justify-between items-center cursor-pointer`}
                           onClick={() => setIsDropdownOpen(!isDropdownOpen)}
                         >
                             <span className={selectedGroup ? 'text-gray-900' : 'text-gray-400'}>
                                 {selectedGroup ? selectedGroup.name : '请搜索并选择分配的项目组...'}
                             </span>
                             <ChevronDown size={16} className={`text-gray-400 transition-transform ${isDropdownOpen ? 'rotate-180' : ''}`} />
                         </div>
                         
                         {isDropdownOpen && (
                             <div className="absolute z-10 w-full mt-1 bg-white border border-gray-200 rounded-md shadow-lg max-h-48 flex flex-col overflow-hidden">
                                 <div className="p-2 border-b border-gray-100 bg-gray-50 flex items-center gap-2">
                                     <Search size={14} className="text-gray-400" />
                                     <input 
                                       type="text" 
                                       placeholder="检索我的项目组..." 
                                       value={groupSearchQuery}
                                       onChange={e => setGroupSearchQuery(e.target.value)}
                                       onClick={e => e.stopPropagation()} 
                                       className="w-full text-sm bg-transparent outline-none py-1"
                                       autoFocus
                                     />
                                 </div>
                                 <div className="overflow-y-auto">
                                     {allowedGroups.filter(g => g.name.toLowerCase().includes(groupSearchQuery.toLowerCase())).map(g => (
                                         <div 
                                            key={g.id} 
                                            className={`px-3 py-2 text-sm cursor-pointer hover:bg-orange-50 transition-colors ${groupId === g.id ? 'bg-orange-50 text-orange-600 font-medium' : 'text-gray-700'}`}
                                            onClick={() => { setGroupId(g.id); setIsDropdownOpen(false); setGroupSearchQuery(''); }}
                                         >
                                             {g.name}
                                         </div>
                                     ))}
                                     {allowedGroups.length > 0 && allowedGroups.filter(g => g.name.toLowerCase().includes(groupSearchQuery.toLowerCase())).length === 0 && (
                                         <div className="px-3 py-4 text-center text-xs text-gray-400">无匹配的项目组</div>
                                     )}
                                     {allowedGroups.length === 0 && (
                                         <div className="px-3 py-4 text-center text-xs text-red-400">你当前未被分配到任何项目组，无法创建项目</div>
                                     )}
                                 </div>
                             </div>
                         )}
                     </div>
                  </div>
                  
                  <div>
                    <label className="block text-sm text-gray-700 mb-1.5">标签</label>
                    <button className="text-gray-500 border border-dashed border-gray-300 px-3 py-1.5 rounded text-sm flex items-center gap-1 hover:border-orange-500 hover:text-orange-500 transition-colors">
                      <Plus size={14} /> 添加标签
                    </button>
                  </div>
                  
                  <div>
                    <label className="block text-sm text-gray-700 mb-1.5">封面图</label>
                    <div onClick={() => fileInputRef.current?.click()} className="w-24 h-24 border border-dashed border-gray-300 rounded flex flex-col items-center justify-center text-gray-400 hover:border-orange-500 hover:text-orange-500 transition-colors cursor-pointer bg-gray-50/50 overflow-hidden relative">
                      {coverImage ? <img src={coverImage} alt="Cover preview" className="w-full h-full object-cover" /> : <><Plus size={24} className="mb-1" strokeWidth={1.5} /><span className="text-xs">点击上传</span></>}
                    </div>
                    <input type="file" ref={fileInputRef} className="hidden" accept="image/*" onChange={handleImageUpload} />
                  </div>
                </div>

                <div className="p-4 border-t border-gray-100 flex justify-end gap-3 bg-gray-50/50">
                  <button onClick={onClose} className="px-4 py-2 text-sm text-gray-600 bg-white border border-gray-200 rounded hover:bg-gray-50 transition-colors">取消</button>
                  <button 
                     onClick={handleSubmit} 
                     disabled={!name.trim() || !groupId} 
                     className={`px-4 py-2 text-sm text-white rounded shadow-sm transition-colors ${name.trim() && groupId ? 'bg-orange-500 hover:bg-orange-600' : 'bg-orange-300 cursor-not-allowed'}`}
                  >
                    创建项目
                  </button>
                </div>
              </div>
            </div>
          );
        };

        function App() {
          const [currentUser, setCurrentUser] = useState(null); 
          
          const [currentPage, setCurrentPage] = useState('xr-platform');
          const [isSidebarExpanded, setIsSidebarExpanded] = useState(false);
          const [selectedProjectId, setSelectedProjectId] = useState(null);
          const [isNewProjectModalOpen, setIsNewProjectModalOpen] = useState(false);

          const [projectGroups, setProjectGroups] = useState(INITIAL_GROUPS);
          const [projects, setProjects] = useState(INITIAL_PROJECTS);
          const [users, setUsers] = useState(INITIAL_USERS);

          if (!currentUser) {
            return <ViewLogin onLogin={setCurrentUser} users={users} />;
          }

          const isSuperUser = ['VP', '数字主管', '可视化专员'].includes(currentUser.role);
          const allowedGroups = isSuperUser ? projectGroups : projectGroups.filter(g => currentUser.groups.includes(g.id));
          const allowedProjects = isSuperUser ? projects : projects.filter(p => p.groupId && currentUser.groups.includes(p.groupId));

          const getTopNavTitle = () => {
            switch (currentPage) {
              case 'user-management': return '系统设置 / 成员与权限';
              case 'render-farm': return 'MI Render Farm';
              default: return 'MI XR Platform';
            }
          };

          const handleUpdateProject = (projectId, updates) => {
            setProjects(projects.map(p => p.id === projectId ? { ...p, ...updates } : p));
          };

          const handleCreateProject = (projectData) => {
            const newProject = {
              id: Date.now(),
              name: projectData.name,
              updated: '刚刚',
              status: '',
              imageColor: 'bg-orange-200', 
              groupId: projectData.groupId,
              coverImage: projectData.coverImage
            };
            setProjects([newProject, ...projects]);
          };

          const handleLogout = () => {
            setCurrentUser(null);
            setCurrentPage('xr-platform');
          };

          const renderMainContent = () => {
            switch (currentPage) {
              case 'user-management':
                return (
                  <ViewUserManagement 
                    onBack={() => setCurrentPage('xr-platform')} 
                    users={users} setUsers={setUsers}
                    projectGroups={projectGroups} setProjectGroups={setProjectGroups}
                    projects={projects}
                  />
                );
              case 'project-detail':
                const currentProject = projects.find(p => p.id === selectedProjectId);
                return (
                  <ViewProjectDetail 
                     project={currentProject} 
                     onBack={() => setCurrentPage('xr-platform')} 
                     onUpdateProject={handleUpdateProject}
                     currentUser={currentUser} 
                     projectGroups={projectGroups}
                  />
                );
              case 'render-farm':
                return <ViewRenderFarm />;
              case 'xr-platform':
              default:
                return (
                  <ViewXRPlatform 
                    projects={allowedProjects}        
                    projectGroups={allowedGroups}     
                    openNewProject={() => setIsNewProjectModalOpen(true)}
                    openProjectDetail={(project) => {
                      setSelectedProjectId(project.id);
                      setCurrentPage('project-detail');
                    }}
                  />
                );
            }
          };

          return (
            <div className="flex h-screen w-full bg-white font-sans text-gray-900 overflow-hidden">
              <Sidebar 
                isExpanded={isSidebarExpanded} 
                setIsExpanded={setIsSidebarExpanded}
                currentPage={currentPage}
                setCurrentPage={(page) => {
                  setCurrentPage(page);
                  if (page !== 'project-detail') setSelectedProjectId(null);
                }}
              />
              
              <div className="flex-1 flex flex-col min-w-0 bg-gray-50 relative">
                <TopNav 
                  title={getTopNavTitle()} 
                  onUserManageClick={() => setCurrentPage('user-management')}
                  currentUser={currentUser}
                  onLogout={handleLogout}
                />
                {renderMainContent()}
              </div>

              <ModalNewProject 
                 isOpen={isNewProjectModalOpen}
                 onClose={() => setIsNewProjectModalOpen(false)}
                 onCreate={handleCreateProject}
                 allowedGroups={allowedGroups} 
              />
            </div>
          );
        }

        // ==========================================
        // 挂载 React 根节点
        // ==========================================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
